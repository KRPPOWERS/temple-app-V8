name: 🛕 Build Temple Android APK

# Trigger on every push to main branch, or manually from GitHub Actions UI
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:          # Allows manual trigger from the Actions tab

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:

      # ── 1. Checkout code ──────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up JDK 17 ─────────────────────────────────────
      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 3. Cache Gradle dependencies ─────────────────────────
      - name: 📦 Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── 4. Make Gradle wrapper executable ────────────────────
      - name: 🔧 Make gradlew executable
        run: chmod +x gradlew

      # ── 5. Verify the HTML asset file exists ─────────────────
      - name: 🔍 Check HTML asset exists
        run: |
          if [ ! -f "app/src/main/assets/temple_v8.html" ]; then
            echo "❌ ERROR: temple_v8.html not found in app/src/main/assets/"
            echo "Please add the HTML file before pushing."
            exit 1
          fi
          echo "✅ temple_v8.html found ($(du -h app/src/main/assets/temple_v8.html | cut -f1))"

      # ── 6. Build Debug APK ────────────────────────────────────
      - name: 🔨 Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # ── 7. Upload APK as artifact ─────────────────────────────
      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: temple-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30     # Keep for 30 days

      # ── 8. Print APK info ─────────────────────────────────────
      - name: 📋 APK Info
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            SIZE=$(du -h "$APK_PATH" | cut -f1)
            echo "✅ Build successful!"
            echo "📱 APK size: $SIZE"
            echo "📥 Download the APK from the Actions tab → Artifacts section"
          fi
